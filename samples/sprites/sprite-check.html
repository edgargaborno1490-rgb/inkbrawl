<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#ece9e3}</style></head><body><div id="out"></div>
<script src="sprites.js"></script><script>
// Check sheet: every traced pose on the arena background, red dot = foot anchor
const POSES = ['idle','punch','kick','hit','fly','ko','run','win'];
const sprite = (sp, x, y, k) => `<g transform="translate(${x},${y}) scale(${k}) translate(${-sp.ax},${-sp.ay})">`
  + `<g fill="#fff">${sp.fill}</g><g fill="#b9b9b9">${sp.grey}</g><g fill="#1a1a1a">${sp.ink}</g></g>`;
let g = '';
['capguy','gorilla'].forEach((c, r) => POSES.forEach((p, i) => { const x = 130 + i * 235, y = 480 + r * 500, sp = SPRITES[c][p];
  g += `<ellipse cx="${x}" cy="${y}" rx="80" ry="16" fill="rgba(60,50,40,.16)"/>` + sprite(sp, x, y, .6) + `<circle cx="${x}" cy="${y}" r="5" fill="red"/>`; }));
document.getElementById('out').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="1920" height="1080" fill="#ece9e3"/>${g}</svg>`;
</script></body></html>
