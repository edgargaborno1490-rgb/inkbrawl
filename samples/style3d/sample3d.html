<!doctype html><html><head><meta charset="utf-8">
<!-- Ink Brawl look samples (pictures only): style-master stick men in a 3D arena seen from above at an angle.
     window.draw(sceneName) draws one sample; render_samples.cjs screenshots each. -->
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#ece9e3}</style>
</head><body><div id="out"></div>
<script></script>
<script src="ink.js"></script>
<script>
const CAST = [
  { name:'@Fighter_01', kit:'ninja', mood:'angry' }, { name:'@Fighter_02', kit:'cap' }, { name:'@Fighter_03', kit:'shades' },
  { name:'@Fighter_04', kit:'bucket' }, { name:'@Fighter_05', kit:'hiker' },
];
const SCENES = {
  // 1. character line-up: the 5 fighters, front view
  lineup() {
    let g = '';
    CAST.forEach((c, i) => {
      const x = 260 + i * 350, y = 860, s = 1.25, fr = fighter({ pose: 'STAND', kit: c.kit, mood: c.mood || 'normal' });
      g += `<ellipse cx="${x}" cy="${y}" rx="${100*s}" ry="${20*s}" fill="${SHADOW}"/>`;
      g += `<g transform="translate(${x},${y}) scale(${s})">${fr.svg}</g>`;
      g += `<text x="${x}" y="${y + (fr.top - 26) * s}" text-anchor="middle" font-family="Permanent Marker" font-size="40" fill="${INK}">${c.name}</text>`;
    });
    return g;
  },
  // 2. 3D arena, wide: free-for-all spread out in depth
  arena() {
    const cam = camera({ x: 110, h: 820, z: -950, pitch: 24, f: 1350 });
    const fx = (() => { const a = cam(-330, 190, 420), b = cam(470, 175, 60); return star(a.x, a.y, 45 * a.s) + star(b.x, b.y, 45 * b.s); })();
    return floorDetails(cam, 7) + scene(cam, [
      { x:-520, z:420, face:1,  name:'@Fighter_01', f:{ pose:'PUNCH', kit:'ninja', mood:'angry' } },
      { x:-250, z:420, face:-1, name:'@Fighter_02', f:{ pose:'HIT', kit:'cap', mood:'ko' } },
      { x:30,   z:780, face:1,  name:'@Fighter_03', f:{ pose:'CHARGE', kit:'shades', mood:'angry' } },
      { x:320,  z:60,  face:1,  name:'@Fighter_04', f:{ pose:'KICK', kit:'bucket', mood:'angry' } },
      { x:600,  z:80,  face:-1, lift:120, rot:-35, name:'@Fighter_05', f:{ pose:'FLY', kit:'hiker', mood:'ko' } },
    ], fx);
  },
  // 3. 3D close action: low angle on two fighters clashing, others behind
  clash() {
    const cam = camera({ x: 40, h: 520, z: -900, pitch: 16, f: 1500 });
    const hit = cam(10, 196, 220);
    return floorDetails(cam, 11) + scene(cam, [
      { x:-760, z:1300, face:1,  name:'@Fighter_04', f:{ pose:'GUARD', kit:'bucket', mood:'normal' } },
      { x:820,  z:1500, face:-1, name:'@Fighter_02', f:{ pose:'RUN', kit:'cap', mood:'angry' } },
      { x:-150, z:220,  face:1,  name:'@Fighter_03', f:{ pose:'PUNCH', kit:'shades', mood:'angry' } },
      { x:170,  z:220,  face:-1, name:'@Fighter_05', f:{ pose:'PUNCH', kit:'hiker', mood:'angry' } },
    ], star(hit.x, hit.y, 55 * hit.s) + marks(hit.x, hit.y - 10 * hit.s, 70 * hit.s, -135) + marks(hit.x, hit.y + 10 * hit.s, 70 * hit.s, 45));
  },
  // 4. winner: high angle, crowned winner, knocked-out fighters around
  winner() {
    const cam = camera({ x: 0, h: 1050, z: -1250, pitch: 30, f: 1500 });
    const a = cam(-150, 330, 300), b = cam(160, 250, 300), c = cam(120, 420, 300);
    return floorDetails(cam, 3) + sparkle(a.x, a.y, 30 * a.s) + sparkle(b.x, b.y, 22 * b.s) + sparkle(c.x, c.y, 16 * c.s) + scene(cam, [
      { x:0,    z:300, face:1,  name:'@Fighter_05', f:{ pose:'WIN', kit:'hiker', mood:'happy', crown:true } },
      { x:-520, z:620, face:1,  rot:-90, lift:70, f:{ pose:'STAND', kit:'ninja', mood:'ko' } },
      { x:560,  z:520, face:-1, rot:-90, lift:70, f:{ pose:'STAND', kit:'cap', mood:'ko' } },
    ]);
  },
};
window.draw = name => {
  document.getElementById('out').innerHTML =
    `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080">${vignette}<rect width="1920" height="1080" fill="${BG}"/>`
    + SCENES[name]() + `<rect width="1920" height="1080" fill="url(#vg)"/></svg>`;
};
window.SCENE_NAMES = Object.keys(SCENES);
draw('lineup');
</script></body></html>
